name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build standalone executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BakuAutopilot --collect-all cv2 --collect-all mss --collect-all pygetwindow main.py
      - name: Build portable folder
        run: pyinstaller --noconfirm --clean --windowed --name BakuAutopilotFolder --collect-all cv2 --collect-all mss --collect-all pygetwindow main.py
      - name: Package portable folder
        run: Compress-Archive -Path dist/BakuAutopilotFolder/* -DestinationPath BakuAutopilot-Portable-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BakuAutopilot-Windows
          path: |
            dist/BakuAutopilot.exe
            dist/BakuAutopilotFolder/
            BakuAutopilot-Portable-Windows.zip
          if-no-files-found: error
